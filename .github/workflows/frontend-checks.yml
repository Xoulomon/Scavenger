name: Frontend Quality Checks

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter scavngr-frontend run format:check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter scavngr-frontend run lint

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter scavngr-frontend run type-check

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter scavngr-frontend run build
      - uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: frontend/dist

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter scavngr-frontend test
        env:
          CI: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit (fail on high/critical)
        run: pnpm --filter scavngr-frontend audit --audit-level=high
