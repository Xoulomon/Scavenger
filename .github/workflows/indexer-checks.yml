name: Indexer Quality Checks

# Issue #957 – per-package coverage; also provides a general test gate for
# the indexer package.

on:
  push:
    branches: [main, develop]
    paths:
      - 'indexer/**'
      - 'tests/contract/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'indexer/**'
      - 'tests/contract/**'

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
        working-directory: indexer
      - run: npx tsc --noEmit
        working-directory: indexer

  test:
    name: Unit & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
        working-directory: indexer
      - name: Run all indexer tests
        run: npm test
        working-directory: indexer
        env:
          CI: true

  security-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
        working-directory: indexer
      - name: Run npm audit (fail on high/critical)
        run: npm audit --prefix indexer --audit-level=high

  contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install contract test dependencies
        run: npm install
        working-directory: tests/contract
      - name: Run contract tests
        run: npx jest
        working-directory: tests/contract
        env:
          CI: true
