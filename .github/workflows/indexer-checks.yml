name: Indexer Quality Checks

# Issue #957 – per-package coverage; also provides a general test gate for
# the indexer package.

on:
  push:
    branches: [main, develop]
    paths:
      - 'indexer/**'
      - 'tests/contract/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'indexer/**'
      - 'tests/contract/**'

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter scavngr-indexer exec tsc --noEmit

  test:
    name: Unit & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run all indexer tests
        run: pnpm --filter scavngr-indexer test
        env:
          CI: true

  security-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit (fail on high/critical)
        run: pnpm --filter scavngr-indexer audit --audit-level=high

  contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run contract tests
        run: pnpm --filter scavngr-contract-tests test
        env:
          CI: true
