name: Performance Baseline Tracking

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  contract-benchmarks:
    name: Contract Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar-contract

      - name: Run performance tests
        working-directory: stellar-contract
        run: cargo test --test performance_test -- --nocapture 2>&1 | tee ../performance-results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: contract-performance-results
          path: performance-results.txt

  api-performance:
    name: API Performance
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/k6
          key: k6-${{ runner.os }}

      - name: Install k6
        run: |
          if ! command -v k6 &>/dev/null; then
            curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
            sudo apt-get update && sudo apt-get install -y k6
          fi

      - name: Run k6 performance tests
        run: ./performance/run-perf-tests.sh
        env:
          BASE_URL: "http://localhost:3000/api"

      - name: Generate performance summary report
        run: |
          echo "## Performance Test Summary" >> $GITHUB_STEP_SUMMARY
          cat performance/reports/performance-summary.md >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-performance-results
          path: |
            k6-results.json
            api-performance-results.json

  performance-report:
    name: Performance Report
    runs-on: ubuntu-latest
    needs: [contract-benchmarks, api-performance]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: contract-performance-results
          path: artifacts/contract
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: api-performance-results
          path: artifacts/api
        continue-on-error: true

      - name: Generate summary
        run: |
          baselines=$(cat performance/baselines.json)
          echo "## Performance Baseline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Contract Instruction Counts" >> $GITHUB_STEP_SUMMARY
          echo "| Operation | Baseline | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|----------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          for key in participant_registration_instructions waste_registration_instructions waste_transfer_instructions incentive_creation_instructions reward_distribution_instructions; do
            baseline=$(echo "$baselines" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).contract['$key'].baseline))")
            threshold=$(echo "$baselines" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).contract['$key'].threshold))")
            label=$(echo "$key" | sed 's/_/ /g')
            echo "| $label | $baseline | $threshold | ⬜ pending |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### API Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Baseline | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/api/api-performance-results.json ]; then
            node -e "
            const results = JSON.parse(require('fs').readFileSync('artifacts/api/api-performance-results.json'));
            for (const r of results) {
              const icon = r.pass ? '✅' : '❌';
              console.log('| ' + r.metric + ' | - | ' + r.threshold + ' | ' + icon + ' ' + r.value + ' |');
            }
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "| p95 ms | 300 | 500 | ⬜ skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| p99 ms | 700 | 1000 | ⬜ skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| error rate % | 1 | 5 | ⬜ skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Baselines defined in \`performance/baselines.json\`. See [PERFORMANCE_BASELINE.md](docs/PERFORMANCE_BASELINE.md) for details._" >> $GITHUB_STEP_SUMMARY

  baseline-documentation:
    name: Baseline Documentation
    runs-on: ubuntu-latest
    needs: [contract-benchmarks, api-performance]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: contract-performance-results
          path: artifacts/contract
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: api-performance-results
          path: artifacts/api
        continue-on-error: true

      - name: Record baseline metrics
        run: |
          mkdir -p performance/reports
          {
            echo "# Performance Baseline Metrics"
            echo ""
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "## Contract Instruction Counts"
            echo ""
            echo "| Operation | Baseline | Threshold |"
            echo "|-----------|----------|-----------|"
            node -e "
            const b = JSON.parse(require('fs').readFileSync('performance/baselines.json'));
            for (const [key, v] of Object.entries(b.contract)) {
              console.log('| ' + key.replace(/_/g, ' ') + ' | ' + v.baseline + ' | ' + v.threshold + ' |');
            }
            "
            echo ""
            echo "## API Endpoint Metrics"
            echo ""
            echo "| Endpoint | Metric | Baseline | Threshold |"
            echo "|----------|--------|----------|-----------|"
            if [ -f artifacts/api/api-performance-results.json ]; then
              node -e "
              const results = JSON.parse(require('fs').readFileSync('artifacts/api/api-performance-results.json'));
              for (const r of results) {
                console.log('| ' + (r.endpoint || 'api') + ' | ' + r.metric + ' | ' + (r.baseline ?? '-') + ' | ' + r.threshold + ' |');
              }
              "
            else
              echo "| verification | p95 ms | 300 | 500 |"
              echo "| verification | p99 ms | 700 | 1000 |"
              echo "| verification | error rate % | 1 | 5 |"
              echo "| transfer | p95 ms | 300 | 500 |"
              echo "| transfer | p99 ms | 700 | 1000 |"
              echo "| transfer | error rate % | 1 | 5 |"
            fi
            echo ""
            echo "_Baselines are tracked in \`performance/baselines.json\` for regression comparison._"
          } > performance/reports/baseline-metrics.md
          cat performance/reports/baseline-metrics.md >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-baseline-metrics
          path: performance/reports/baseline-metrics.md
