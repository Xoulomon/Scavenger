# Visual Regression — closes #960
#
# Runs on every PR that touches frontend source. Compares screenshots against
# committed baselines in e2e/__snapshots__/. Diffs are uploaded as artifacts.
#
# The `update_baselines` input lets you regenerate baselines from CI without a
# local Playwright install: go to Actions → Visual Regression → Run workflow,
# set update_baselines=true, and the workflow commits updated snapshots back to
# the branch automatically.

name: Visual Regression

on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/visual-regression.spec.ts'
      - 'frontend/playwright.config.ts'
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'

  # Manual trigger — set update_baselines=true to regenerate snapshots
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Regenerate and commit baseline screenshots'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # ── Run visual tests in parallel per browser ─────────────────────────────────
  visual-test:
    name: Visual (${{ matrix.project }})
    runs-on: ubuntu-latest
    if: github.event.inputs.update_baselines != 'true'

    strategy:
      fail-fast: false
      matrix:
        project: [visual-chromium, visual-firefox, visual-mobile]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter scavngr-frontend exec playwright install --with-deps ${{ matrix.project == 'visual-chromium' && 'chromium' || matrix.project == 'visual-firefox' && 'firefox' || 'chromium' }}

      - name: Run visual regression tests (${{ matrix.project }})
        run: pnpm --filter scavngr-frontend exec playwright test --project=${{ matrix.project }}
        env:
          CI: true

      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ matrix.project }}
          path: frontend/playwright-report/
          retention-days: 30

  # ── Gate: all three browser projects must pass ────────────────────────────────
  visual-regression-gate:
    name: Visual Regression Gate
    runs-on: ubuntu-latest
    needs: visual-test
    if: always() && github.event.inputs.update_baselines != 'true'
    steps:
      - name: Check all visual tests passed
        run: |
          if [ "${{ needs.visual-test.result }}" != "success" ]; then
            echo "One or more visual regression projects failed."
            echo "Download the 'visual-diff-*' artifacts to review diffs."
            echo "If the changes are intentional, re-run with update_baselines=true."
            exit 1
          fi
          echo "All visual regression tests passed."

  # ── Baseline update: regenerate and commit snapshots ─────────────────────────
  update-baselines:
    name: Update Visual Baselines
    runs-on: ubuntu-latest
    if: github.event.inputs.update_baselines == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT so the commit triggers downstream workflows
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install all Playwright browsers
        run: pnpm --filter scavngr-frontend exec playwright install --with-deps chromium firefox

      - name: Regenerate baselines
        run: pnpm --filter scavngr-frontend run visual:update
        env:
          CI: true

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/__snapshots__
          if git diff --staged --quiet; then
            echo "No baseline changes detected."
          else
            git commit -m "chore: update visual regression baselines [skip ci]"
            git push
          fi
