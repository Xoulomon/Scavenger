repos:
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: cargo +1.94.1 fmt --all --check
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: prettier-check
        name: prettier --check
        entry: bash -lc 'for dir in frontend indexer mobile packages/scavenger-sdk; do if [ -f "$dir/package.json" ]; then (cd "$dir" && npx prettier --check . || exit 1); fi; done'
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
