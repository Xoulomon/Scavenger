[package]
name = "scavenger-backend"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Inherit workspace-wide lint configuration (issue #1308).
# All rules are defined once in the root Cargo.toml [workspace.lints] section.
[lints]
workspace = true

[dependencies]
# #1085: audited against actual `use`/path references in src/. Anything not
# reachable that way was dropped; see the removed list below the table for
# what was cut and why. `url` and `sha2` were added because search/client.rs
# and services/archival_storage.rs already import them directly but they
# were missing from this manifest (only reachable before as transitive deps
# of elasticsearch/aws-sdk-s3, which does not make them usable via `use`).
actix-web = "=4.15.0"
tokio = { version = "=1.53.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
thiserror = "=1.0.69"
reqwest = { version = "=0.12.28", features = ["json"] }
bytes = "=1.12.1"
async-trait = "=0.1.92"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
futures = "=0.3.34"
printpdf = "=0.12.7"
actix-ws = "=0.3.1"
rand = "=0.8.8"
hex = "=0.4.3"
actix-web = "4.4"
actix-rt = "2.9"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
dotenv = "0.15"
reqwest = { version = "0.11", features = ["json"] }
lettre = { version = "0.11", features = ["smtp-transport", "builder"] }
handlebars = "4.4"
aws-config = "1.0"
aws-sdk-s3 = "1.0"
tokio-util = "0.7"
bytes = "1.5"
image = "0.24"
pdf = "0.9"
csv = "1.3"
async-trait = "0.1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
printpdf = "0.12"
actix-ws = "0.3"
rand = "0.8"
hex = "0.4"
actix-cors = "=0.7.2"
elasticsearch = "=9.1.0-alpha.1"
flate2 = "=1.1.10"
base64 = "=0.22.1"
urlencoding = "=2.1.3"
url = "=2.5.8"
sha2 = "=0.10.9"
hmac = "0.12"

# Removed as confirmed-unused by #1085 (no `use`/path reference anywhere in
# src/ — verified by grepping every crate root against the source tree):
#   actix-rt        — actix-web's `#[actix_web::main]`/`#[actix_web::test]` macros
#                      pull in their own runtime; nothing calls actix_rt directly.
#   log, env_logger — superseded by tracing/tracing-subscriber; no `log::`/init call.
#   dotenv          — no `dotenv::dotenv()` call; env vars are read via std::env.
#   lettre          — email.rs sends via a raw reqwest::Client, not lettre.
#   handlebars      — no template rendering call exists; only mentioned in a doc comment.
#   aws-config, aws-sdk-s3 — storage.rs defines types only, no S3 client is built.
#   tokio-util      — no reference.
#   image, pdf, csv — reporting/export services build these formats by hand
#                      (printpdf for PDFs, manual string building for CSV);
#                      these crates are never called.
#   tracing-actix-web — no TracingLogger/middleware usage.
#   actix-web-actors  — actix-ws already covers the one websocket handler in use.

[dev-dependencies]
# mockall, tokio-test, tempfile removed by #1085: no `#[automock]`/`mock!`,
# `tokio_test::`, or `tempfile::` reference anywhere in src/.
wiremock = "=0.6.5"
# #1481: property-based tests for the pure geometry helpers in
# services/geospatial.rs (tests/geospatial_geometry_proptest.rs).
proptest = "1.4.0"
# #1530: integration tests that start real Postgres and Redis containers.
# testcontainers 0.23 ships the `postgres` and `redis` pre-built images.
testcontainers = "=0.23.1"
testcontainers-modules = { version = "=0.11.4", features = ["postgres", "redis"] }
# #1530: tokio-postgres client used in the common TestEnv fixture and
# integration tests to verify real query behaviour.
tokio-postgres = "=0.7.12"

[lib]
name = "scavenger_backend"
path = "src/lib.rs"

[[bin]]
name = "scavenger-backend"
path = "src/main.rs"

# #1563: `dashmap`, `lru` and `redis` were reported unused by cargo-machete
# (no `use`/path reference anywhere in src/ or tests/) and have been removed.
# Re-run `cargo machete` after adding any new module that needs them.