# Local development override.
#
# All services are defined in the base docker-compose.yml. This file only
# overrides build targets, ports, environment and volumes for local dev.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile monitoring up
#
# See the "Developer Setup" section of README.md (and docs/getting-started.md)
# for prerequisites, the full list of environment variables, and the verified
# from-scratch setup path. Every variable named there has a sensible local
# default below; override any of them via your shell or a local .env file.
#
# Backwards-compatibility: only local-dev defaults change here. The production
# compose file (docker-compose.yml) is untouched.

services:
  postgres:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.multistage
      target: development
    environment:
      - RUST_LOG=debug
      - LOG_LEVEL=debug
      - PORT=8080
      - DATABASE_URL=postgresql://scavenger_user:scavenger_pass@postgres:5432/scavenger
      - REDIS_URL=redis://redis:6379
      - S3_BUCKET=scavenger-local
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - STELLAR_RPC_URL=http://stellar:11626/soroban/rpc
      - STELLAR_NETWORK_PASSPHRASE=Test SDF Network ; September 2015
      - SOROBAN_RPC_URL=http://stellar:11626/soroban/rpc
      - CONTRACT_ID=${CONTRACT_ID}
    ports:
      - '8080:8080'

  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile.multistage
      target: development
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - PORT=3000
      - DATABASE_URL=postgresql://scavenger_user:scavenger_pass@postgres:5432/scavenger
      - REDIS_URL=redis://redis:6379
      - STELLAR_RPC_URL=http://stellar:11626/soroban/rpc
      - STELLAR_NETWORK_PASSPHRASE=Test SDF Network ; September 2015
      - SOROBAN_RPC_URL=http://stellar:11626/soroban/rpc
      - CONTRACT_ID=${CONTRACT_ID}
    ports:
      - '3000:3000'

  stellar:
    environment:
      - STELLAR_NETWORK_PASSPHRASE=Test SDF Network ; September 2015
      - STELLAR_RPC_URL=http://stellar:11626/soroban/rpc
      - SOROBAN_RPC_HOST=0.0.0.0
      - SOROBAN_RPC_URL=http://stellar:11626/soroban/rpc
    ports:
      - '8000:8000'
      - '11626:11626'
      - '11627:11627'
    volumes:
      - stellar_data:/opt/stellar/data

volumes:
  stellar_data:
