# Authoritative Deployment manifest for the Scavenger backend.
# Environment-specific values (replicas, image tags, resource sizing, env vars)
# are provided by the Kustomize overlays in k8s/overlays/{dev,staging,prod}.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scavenger-config
  namespace: default
  labels:
    app: scavenger-contract
data:
  stellar_network: "testnet"
  api_url: "http://scavenger-contract.default.svc.cluster.local"
  log_level: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scavenger-contract
  namespace: default
  labels:
    app: scavenger-contract
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: scavenger-contract
  template:
    metadata:
      labels:
        app: scavenger-contract
        version: v1
    spec:
      serviceAccountName: scavenger-contract
      containers:
      - name: contract
        image: ghcr.io/xoulomon/scavenger:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info"
        - name: STELLAR_NETWORK
          valueFrom:
            configMapKeyRef:
              name: scavenger-config
              key: stellar_network
        - name: CONTRACT_ID
          valueFrom:
            secretKeyRef:
              name: scavenger-secrets
              key: contract_id
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/scavenger
          readOnly: true
        - name: secrets
          mountPath: /etc/scavenger/secrets
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: config
        configMap:
          name: scavenger-config
      - name: secrets
        secret:
          secretName: scavenger-secrets
          optional: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - scavenger-contract
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: scavenger-contract
  namespace: default
  labels:
    app: scavenger-contract
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: scavenger-contract
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scavenger-frontend
  namespace: default
  labels:
    app: scavenger-frontend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: scavenger-frontend
  template:
    metadata:
      labels:
        app: scavenger-frontend
        version: v1
    spec:
      containers:
      - name: frontend
        image: ghcr.io/xoulomon/scavenger-frontend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: scavenger-config
              key: api_url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: scavenger-frontend
  namespace: default
  labels:
    app: scavenger-frontend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: scavenger-frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scavenger-contract-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scavenger-contract
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scavenger-contract-pdb
  namespace: default
  labels:
    app: scavenger-contract
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: scavenger-contract
